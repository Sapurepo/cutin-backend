name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # 데코레이터 메타데이터 방출은 tsc 빌드에서만 검증된다.
      # typecheck(noEmit)로는 산출물이 깨진 것을 잡지 못한다.
      - run: pnpm build

      - run: pnpm test
