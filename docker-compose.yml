name: cutin

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cutin
      POSTGRES_PASSWORD: cutin
      POSTGRES_DB: cutin
    ports:
      - '5432:5432'
    volumes:
      - postgresData:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cutin -d cutin']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgresData:
